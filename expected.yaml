# Expected DNS state of iskri.io, checked by .github/workflows/dns-check.yml
#
# Record names are relative to the domain, and "@" stands for the apex.
# Each listed type must match exactly, and [] means the type must not
# exist. Names and types that aren't listed are not checked. The supported
# types are A, AAAA, CNAME, MX, TXT and CAA. A name with a CNAME lists no
# other types. Always quote TXT values.
domain: iskri.io
nameservers:
  - a.ns.selectel.ru
  - b.ns.selectel.ru
  - c.ns.selectel.ru
  - d.ns.selectel.ru
expiry:
  rdap_base_url: https://rdap.identitydigital.services/rdap/
  min_days_left: 30
records:
  "@":
    A:
      - 185.199.108.153
      - 185.199.109.153
      - 185.199.110.153
      - 185.199.111.153
    AAAA:
      - 2606:50c0:8000::153
      - 2606:50c0:8001::153
      - 2606:50c0:8002::153
      - 2606:50c0:8003::153
    CAA: []
  www:
    CNAME: iskri-ai.github.io
  _github-pages-challenge-iskri-ai:
    TXT: "ca2e9b2ffa3cf79f0eb16318651739"
