# Expected DNS state of iskri.io, checked by .github/workflows/dns-check.yml.
#
# records: names are relative to the domain, "@" is the apex. A listed
# type must match exactly, [] means "must not exist", unlisted types and
# names are not checked. Supported types: A, AAAA, CNAME, MX, TXT, CAA.
# Always quote TXT values.
domain: iskri.io
nameservers:
  - a.ns.selectel.ru
  - b.ns.selectel.ru
  - c.ns.selectel.ru
  - d.ns.selectel.ru
expiry:
  rdap_base_url: https://rdap.identitydigital.services/rdap/
  min_days_left: 30
records: {}
